# index.yaml — ROUTER del proyecto.
# La IA lee ESTE archivo primero y salta a la sección exacta de PLAN.md que necesita,
# sin recorrer todo el plan cada vez. El detalle completo vive en PLAN.md (§1-§8).
proyecto: "RGTools — Optimizer & GameGuard"
plataforma: "Windows 11 · .NET 10 · WPF tray · requireAdministrator (manifest)"
estado_global: "Fases 0-3 + 2 auditorías + tests (19/19). Perfiles resilientes a crash/corte de luz (sanitize en arranque, escritura atómica, sin acumular planes de energía). Optimizado para Intel 265K + RTX 5070 Ti + 64GB + UPS. Pendiente: test funcional manual"
ultima_revision: "2026-05-30"
fuente_detalle: "PLAN.md"
solucion: "3 proyectos — RGTools.Core (lib, lógica) · RGTools.App (WPF tray) · RGTools.Tests (xUnit+NSubstitute). Core extraído para testear sin XAML."
hardware_usuario: "Intel Core Ultra 7 265K · ASUS TUF Z890 · 64GB DDR5 6400 · RTX 5070 Ti 16GB · 2 monitores (34\" 180Hz + LG vertical) · SSD PCIe 5.0 · UPS Forza 1500VA"

reglas:
  codigo: "sin comentarios; nombres autoexplicativos"
  git: "NUNCA commit/push/tag — lo ejecuta el usuario a mano"
  idioma: "código en inglés; comunicación en español"
  alcance: "solo Windows 11; cambios aditivos, no romper lo que funciona"

servicios:
  DnsGuardianService: { prioridad: core, estado: endurecido-logica-intacta, interfaz: IDnsGuardianService, nota: "siempre ON; KillAll no lo toca" }
  VpnService:         { prioridad: core, estado: activo, interfaz: IVpnService, nota: "privacidad — el corp no entra al equipo personal" }
  JumpboxService:     { prioridad: core, estado: activo, interfaz: IJumpboxService, nota: "desacoplado de UI; LaunchAsync(path)->JumpboxResult" }
  StartupService:     { prioridad: media, estado: async, nota: "checkbox sincronizado con tarea real via IsEnabledAsync" }
  ConfigService:      { estado: reescrito, persistencia: "%APPDATA%/RGTools", nota: "path inyectable para tests" }
  CopilotService:     { estado: eliminado, nota: "Meet borrado; se reharía desde cero si vuelve" }
  WorkService:        { estado: eliminado, nota: "reemplazado por perfiles" }

fases:
  fase0_fundacion:    { estado: hecho }
  fase1_optimizacion: { estado: hecho }
  fase2_perfiles:     { estado: hecho, modos: [Work, Gaming, Zen, KillAll] }
  fase3_healthcheck:  { estado: hecho }
  auditoria_general:  { estado: hecho, detalle: "PLAN.md §7", dnsguardian: "endurecido (lock/try-catch/_disposed)" }
  auditoria_riesgos:  { estado: hecho, detalle: "PLAN.md §8 — resiliencia crash/corte de luz + optimización hardware real" }
  tests:              { estado: hecho, framework: "xUnit + NSubstitute", cobertura: "ModeManager (10) + UserConsent (3) + Config (3) + SystemStateStore (3) + HostsRollback (2) = 21 verdes" }
  auditoria_final:    { estado: hecho, detalle: "3ª pasada Opus; 2 bugs reales corregidos: Work no restauraba hosts de Zen (crash en Zen dejaba sitios bloqueados) + silenciador sobrescribía snapshot. Extraído IHostsBlocker; rollback simétrico" }

perfiles:
  Work:    "estado base; restaura WSearch/GPU registry/toasts/plan de energía"
  Gaming:  "cierra Docker/WSL2/LM Studio/Slack/Discord/Spark/WhatsApp/qBittorrent (cierre ordenado+force); NO Teams/VSCode/navegador; High Performance; silencia toasts Windows; GPU Priority [opt-in]; NO auto-abre launchers; monitor 2º se mantiene"
  Zen:     "silencia notif no críticas + Pomodoro 25/5; bloqueo hosts [opt-in] por marcador de línea"
  KillAll: "'Restaurar Estado Limpio': vuelve a Work + apaga VPN; NO cierra app; NO toca DNS"

decisiones:
  comentarios: cero
  arquitectura: "Generic Host + DI; Core/UI separados"
  operaciones_riesgosas: "rollback transaccional + opt-in + escritura atómica + sanitize en arranque"
  notificaciones: "H.NotifyIcon (no WindowsAppSDK/MSIX)"
  power_plan: "High Performance estándar (NO duplicatescheme — acumulaba planes basura)"
  monitor_secundario: "NO se apaga (panel vertical de consulta)"
  sysmain: "no se toca (SSD + 64GB lo hacen irrelevante)"

invasivas_requieren_optin: [editar-hosts, gpu-priority-hklm]
staged_no_implementado: [nagle-off, apagar-monitor-2, monitor-gaming-45s, temperaturas]

navegacion:
  auditoria_y_deuda:  { plan_seccion: "§1. Auditoría",        cuando: "estado actual y bugs resueltos" }
  arquitectura:       { plan_seccion: "§2. Arquitectura",      cuando: "DI, IMode, patrón rollback transaccional" }
  fases:              { plan_seccion: "§3. Fases",             cuando: "qué hace cada fase/perfil exactamente" }
  desviaciones:       { plan_seccion: "§4. Desviaciones",      cuando: "límites conocidos y staged" }
  progreso:           { plan_seccion: "§5. Estado de progreso", cuando: "checklist + estructura de archivos" }
  como_probar:        { plan_seccion: "§6. Cómo probar",       cuando: "build + tests + smoke + funcional" }
  auditoria_general:  { plan_seccion: "§7. Auditoría",          cuando: "30 hallazgos, qué se arregló" }
  auditoria_riesgos:  { plan_seccion: "§8. Auditoría riesgos",  cuando: "crash/corte de luz/transiciones + hardware" }

mapa_archivos:
  composition_root: "RGTools.App/App.xaml.cs (Host + DI)"
  abstracciones:    "RGTools.Core/Abstractions/*.cs"
  config:           "RGTools.Core/{AppPaths,AppSettings,ConfigService,StateKeys}.cs"
  infra:            "RGTools.Core/{NotificationService,UserConsentService,SystemStateStore,ProcessRunner}.cs"
  core_services:    "RGTools.Core/{DnsGuardianService,VpnService,JumpboxService,StartupService}.cs"
  soporte_modos:    "RGTools.Core/{PowerPlanService,GpuPriorityService,WorkloadGuardService,NotificationSilencerService,HealthCheckService}.cs"
  modos:            "RGTools.Core/Modes/{ModeManager,WorkModeService,GamingModeService,ZenModeService,KillAllService}.cs"
  ui:               "RGTools.App/{App.xaml.cs, ViewModels/TrayViewModel.cs, Views/DashboardView.xaml.cs}"
  tests:            "RGTools.Tests/{ModeManager,UserConsentService,ConfigService,SystemStateStore}Tests.cs"
